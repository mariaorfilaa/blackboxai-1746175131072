<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Closet Capture</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.2.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-pink-200">
  <header class="p-4 flex flex-col items-center w-full max-w-3xl mx-auto space-y-4 bg-white rounded-lg shadow-md">
    <h1 class="text-3xl font-bold">👗 Closet Capture 👚</h1>
    <button id="addItemBtn" class="bg-pink-400 text-white px-6 py-3 rounded hover:bg-pink-500 transition flex items-center space-x-2">
      <i class="fas fa-plus"></i>
      <span>Agregar artículo manualmente</span>
    </button>
  </header>

  <main class="flex-grow container mx-auto p-4">
    <section class="mb-6 flex flex-col items-center space-y-4">
      <h2 class="text-2xl font-semibold mb-2">📸 Captura o sube fotos del armario</h2>
      <input type="file" id="photoInput" accept=".jpg,.jpeg,.png,.gif" multiple class="mb-4 border-4 border-dashed border-pink-300 rounded-lg p-4 cursor-pointer bg-white w-full max-w-md" />
      <button id="detectBtn" class="bg-green-400 text-white px-6 py-3 rounded hover:bg-green-500 transition flex items-center space-x-2">
        <i class="fas fa-magnifying-glass"></i>
        <span>Detectar artículos</span>
      </button>
    </section>

    <section>
      <h2 class="text-xl font-semibold mb-2">Armario virtual</h2>
      <div id="closetItems" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </section>
  </main>

  <!-- Edit Item Modal -->
  <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
    <div class="modal-content p-6 w-full max-w-md">
      <h3 class="text-lg font-semibold mb-4">Editar artículo</h3>
      <form id="editForm" class="space-y-4">
        <input type="hidden" id="editItemId" />
        <div>
          <label for="editName" class="block font-medium">📝 Nombre</label>
          <input type="text" id="editName" class="w-full border border-pink-300 rounded px-3 py-2" />
        </div>
        <div>
          <label for="editType" class="block font-medium">👕 Tipo</label>
          <select id="editType" class="w-full border border-pink-300 rounded px-3 py-2">
            <option>Top</option>
            <option>Pantalones</option>
            <option>Chaqueta</option>
            <option>Vestido</option>
            <option>Falda</option>
            <option>Otro</option>
          </select>
        </div>
        <div>
          <label for="editSeason" class="block font-medium">🍂 Temporada</label>
          <select id="editSeason" class="w-full border border-pink-300 rounded px-3 py-2">
            <option>Todo</option>
            <option>Primavera</option>
            <option>Verano</option>
            <option>Otoño</option>
            <option>Invierno</option>
          </select>
        </div>
        <div>
          <label for="editColor" class="block font-medium">🎨 Color</label>
          <input type="text" id="editColor" class="w-full border border-pink-300 rounded px-3 py-2" />
        </div>
        <div class="flex justify-end space-x-2">
          <button type="button" id="cancelEditBtn" class="px-4 py-2 rounded border border-pink-300 hover:bg-pink-100">Cancelar</button>
          <button type="submit" class="bg-pink-400 text-white px-4 py-2 rounded hover:bg-pink-500">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Item Modal -->
  <div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
    <div class="modal-content p-6 w-full max-w-md">
      <h3 class="text-lg font-semibold mb-4">➕ Agregar artículo manualmente</h3>
      <form id="addForm" class="space-y-4">
        <div>
          <label for="addName" class="block font-medium">📝 Nombre</label>
          <input type="text" id="addName" class="w-full border border-pink-300 rounded px-3 py-2" />
        </div>
        <div>
          <label for="addType" class="block font-medium">👕 Tipo</label>
          <select id="addType" class="w-full border border-pink-300 rounded px-3 py-2">
            <option>Top</option>
            <option>Pantalones</option>
            <option>Chaqueta</option>
            <option>Vestido</option>
            <option>Falda</option>
            <option>Otro</option>
          </select>
        </div>
        <div>
          <label for="addSeason" class="block font-medium">🍂 Temporada</label>
          <select id="addSeason" class="w-full border border-pink-300 rounded px-3 py-2">
            <option>Todo</option>
            <option>Primavera</option>
            <option>Verano</option>
            <option>Otoño</option>
            <option>Invierno</option>
          </select>
        </div>
        <div>
          <label for="addColor" class="block font-medium">🎨 Color</label>
          <input type="text" id="addColor" class="w-full border border-pink-300 rounded px-3 py-2" />
        </div>
        <div class="flex justify-end space-x-2">
          <button type="button" id="cancelAddBtn" class="px-4 py-2 rounded border border-pink-300 hover:bg-pink-100">Cancelar</button>
          <button type="submit" class="bg-pink-400 text-white px-4 py-2 rounded hover:bg-pink-500">Agregar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
